<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Rival Space</title>
    <!-- Telegram Mini App WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          let _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return _fetch;
            },
            set(v) {
              _fetch = v;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if re-definition is locked
        }
      })();
    </script>
  </head>
  <body class="bg-[#07070a] text-zinc-100 antialiased overflow-x-hidden selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
